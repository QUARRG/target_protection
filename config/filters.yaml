
FilterGPS:
  # Kalman filter parameters
  P: [0.0001, 0.0001, 0.25, 0.15]
  Q: [0.0, 0.0, 0.0001, 0.0]
  V: [0.1, 0.1, 0.1]
  predict_hz: 100.0
  update_hz: 10.0
  seed: 60
  # Parameters for circle distortion
  embedding_fn_name: modelA
  frame_id: world
  hover_height: 0.8  # meters
  radius_nominal: 0.9  # meters
  omega_nominal: 0.2  # radians per second
  k_phi: 1.0

FilterRelative:
  # Kalman filter parameters
  P_ego: [0.0001, 0.0001, 0.25, 0.15]
  Q_ego: [0.0, 0.0, 0.0001, 0.0]
  V_ego: [0.1, 0.1, 0.1]
  P_rel: [0.0001, 0.0001, 0.25]
  Q_rel: [0.0, 0.0, 0.001]
  V_rel: [0.1, 0.1, 0.1]
  predict_hz: 100.0
  update_hz: 10.0
  seed: 60
  # Parameters for circle distortion
  embedding_fn_name: modelA
  frame_id: world
  hover_height: 0.8 # meters
  radius_nominal: 0.9 # meters
  omega_nominal: 0.2   # radians per second
  k_phi: 1.0

FilterUnicycle:
  # Kalman filter parameters
  P: [1.0, 1.0, 0.15, 0.5, 0.2, 0.1]
  Q: [0.1, 0.1, 0.01, 0.05, 0.1, 0.25]
  V: [0.1, 0.1, 0.1]
  predict_hz: 100.0
  update_hz: 10.0
  seed: 60
  # Other parameters
  frame_id: world
  hover_height: 0.3  # meters
  zupt_threshold: 0.05 # m/s
  k_phi: 10.0

FilterSpatial:
  # General parameters
  predict_hz: 100.0
  update_hz: 10.0
  seed: 60
  # Parameters for 3D circle distortion
  embedding_fn_name: modelE  # Always modelE for spatial filter
  frame_id: world
  hover_height: 1.2  # meters
  radius_nominal: 0.75  # meters
  omega_z_nominal: 0.6  # radians per second (planar rotation around z)
  omega_y_nominal: 0.0  # radians per second (spatial rotation around y)
  k_phi_z: 1.0  # Gain for planar phase controller
  k_phi_y: 0.5  # Gain for spatial rotation controller
  adjoint_angle: 0.0  # Initial guess for y-axis rotation angle
